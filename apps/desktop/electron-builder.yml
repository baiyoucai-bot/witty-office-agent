# Windows 安装器打包配置。由 scripts/build_windows_installer.py 驱动：
# 它先把 CPython + witty_agent + uv/busybox 备到 build-win/，再跑 electron-builder。
# 单独跑 electron-builder 而不先 staging，产出的安装器没有后端，装上就是空壳。
appId: org.wittyagent.desktop
productName: 人和
executableName: WittyAgent
directories:
  output: release
  buildResources: build
# 只打壳的四样进 asar；staging、构建工具、测试脚本都不进
files:
  - main.js
  - api.js
  - preload.js
  - renderer/**
asar: true
extraResources:
  - from: build-win/python
    to: python
  - from: build-win/bin
    to: bin
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 人和
  artifactName: WittyAgent-Setup-${version}.exe
  runAfterFinish: true
  deleteAppDataOnUninstall: false
