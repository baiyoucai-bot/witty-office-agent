[memory.cues]
# 线索支持两个算子（两侧都要有实字才算算子，所以 `sk-` 这类仍按字面匹配）：
#   `核心+护词|护词`  同一分句里还有护词才算命中，长度按 核心+护词 一起算
#   `核心-忌词|忌词`  同一分句里出现忌词就不算命中
# 一句话里两格都命中时，**匹配到的字面更长**的那格赢（`下次不要` 比 `下次` 长，长的那条
# 本来就是写给更窄的情形的）；平手则都进，因为这一带真有两件事同时说的句子。较量只在
# 分句内进行，跨逗号不算——`以后都叫我老王，联系我走内网邮箱` 里的 `联系` 只是动词。
# domain / assets 故意不给线索词：它俩没有词面标记，判不了就丢掉，不默认塞进领域要点
#（判官跑不起来时由 `_structural_leftover` 按句子结构认）。
prefs = ["我喜欢", "我爱", "爱吃", "我习惯", "以后都", "下次不要", "别再用", "请用", "偏好", "默认用", "叫我", "请简称", "不要每次"]
# `我在` 得跟着岗位/部门词才算身份，否则 `我在等厂家回话` / `我在城东变现场` 都成了身份。
who = ["我是", "我叫", "我负责", "我分管", "我在+做|负责|管|专责|岗位|科室|部门|中心|班组", "岗位是"]
goals = ["目标是", "这次要", "需要完成", "请帮我做成"]
# `不能` 后面跟因果解释时是在讲领域规律，不是红线：`五防校验不能通过是因为双位置不一致`。
constraints = ["不能-是因为|一般是|原因是|通常是", "禁止", "必须先", "红线", "未经批准", "不要写入"]
# `就用这个` 太窄，漏掉 `就用 104 规约` / `点表就用共享盘那份`；收成 `就用`。
decisions = ["就按", "就用", "就这样定", "以后按这个", "就选"]
followups = ["下次", "记得", "待会", "回头再", "跟进"]
# `联系` 当动词时跟联系人无关（`这事要联系厂家确认`），只认名词形式。
people = ["联系人", "联系方式", "联系电话", "班组", "科室", "处室", "项目经理"]

[memory.assistant_cues]
# 助手口吻只记决定/跟进，写进工作区，不进用户 prefs/who。
decisions = ["已决定", "就这样定", "就按这个定", "拍板为", "以后按这个"]
followups = ["下次跟进", "待跟进", "回头再做"]

[memory.skip]
# 命中则不写入记忆
needles = ["password", "token", "api_key", "secret", "sk-", "口令", "密码", "密钥"]

[memory.process]
# 执行过程句不进九宫格/分类。偏好句里的「用 grep」仍走 prefs。
needles = [
  "我先看", "我先读", "我先查", "先跑一遍", "再跑一遍",
  "已经改了", "已经读了", "刚改完", "刚看了", "刚才看",
  "用 grep", "用 read", "用 find", "调用了", "工具结果",
  "打开文件", "列出目录", "搜了一下",
]

[memory.pref_slots]
taste = ["喜欢吃", "爱吃", "喜欢喝", "爱喝"]
address = ["叫我", "请简称"]
habit = ["我习惯", "以后都", "默认用", "请用"]
avoid = ["下次不要", "别再用", "不要每次"]
like = ["我喜欢", "我爱", "偏好"]

[memory.pref_retract]
cues = ["不吃", "不喝", "不喜欢", "不再", "别再", "不要再", "不爱", "改成"]
