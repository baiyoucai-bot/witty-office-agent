# 九宫格记忆 + 内容分类。可用 WITTY_MEMORY_FILE 换文件。
# 格子和分类都是配置，不要在代码里写「如果是某某行业就怎样」。

[memory]
auto_harvest = true
# 不把 read/grep 等执行过程写进记忆。只收用户说的重要结论。
harvest_process = false
# 没对上格子的句子交给模型判断要不要记、记到哪一格。判不了就丢掉，不默认塞进领域要点
judge_leftover = true
working_set = 12
archive_cap = 80
retrieve_limit = 4
inject_claim_cap = 3
inject_char_cap = 1200
topic_switch_overlap = 0.4
focus_max_chars = 2200
max_bullets = 40
# 判官（judge_leftover）是收割路上唯一的网络调用，不在关键路径上跑：本轮结束就把句子
# 交给后台，下一轮开头最多等这么久。超时不取消，让它继续跑，结果留给再下一轮。
judge_settle_sec = 8

[memory.gc]
# 工作区记忆按 cwd 哈希建目录，每个新 cwd 都会留一个。一次性的 cwd（临时目录、
# 测试工作区、跑完就删的检出）于是只增不减，全是空壳。
# 只清**一条记忆都没写过**的目录，且原 cwd 已不在或超过 ttl 没动过。
# 有内容的目录一律不动——哪怕它的工作区早就删了，那也是用户数据。
enabled = true
workspace_ttl_days = 30

[memory.consolidate]
# 巩固：把一格里越攒越碎的条目交给模型合并成更少更准的几条。
# 收割只会 append + 按字面去重，同一件事换个说法就占两个槽（`点表在共享盘` /
# `点表台账放 //nas/dispatch/points/`）。槽位是有限的（working_set），碎片多了就把
# 真正有用的挤进归档。巩固是唯一能把「越用越糊」扳回来的一步。
enabled = true
# 整份记忆的总条数预算。超了就挑最满的格子巩固
total_cap = 400
# 单格攒到这么多条就该整理。working_set 是硬上限，这个是水位线
cell_high_water = 10
# 两次巩固至少隔这么多轮，别每轮都喊模型
min_turns_between = 20
# 一次最多整理几格
max_cells_per_run = 2

[memory.retrieve]
min_score = 3
# 归档升 Recalled 要比工作集更严；弱重叠只留浏览 hint
archive_min_score = 5
# dated bullets older than this many days lose decay_penalty per window; 0 = off
decay_days = 14
decay_penalty = 2
# working set 没命中时，把重叠的归档条升成 Recalled
archive = true
# 「单个 2 字词不算命中」的唯一例外：这个词在整份记忆里独一份。中文实词多是两字
# （老王、台账、检修），一律挡掉等于精确报专名也召不回；可 `回复`、`内容` 同样两字，
# 放行就是假命中。分开两者靠 df，而 df 要有统计意义得先有语料——所以记忆攒到
# rare_corpus_min 条以后才启用，且要求 df 占比不超过 rare_df_ratio。
rare_corpus_min = 25
rare_df_ratio = 0.05
stopwords = [
  "这次", "这个", "那个", "一个", "可以", "需要", "我们", "他们", "什么", "怎么",
  "一下", "还是", "以及", "或者", "因为", "所以", "如果", "已经", "还要", "没有",
  "不是", "就是", "然后", "但是", "还有", "进行", "相关", "内容", "问题", "一下",
  "the", "and", "for", "with", "this", "that", "from",
]

[memory.aliases]
# 纯字面召回跨不过说法差异：记忆里写「本月要把点表核对一遍」，问「这个月的目标是什么」
# 一个词都不重叠，召回为空。这张表只做**加法**——问句原样不动，命中的同义词接在后面，
# 让它们的 n-gram 也进候选。这不是语义检索，只把固定说法在配置里打通。
# 左边是问句里可能出现的词，右边是记忆里可能写成的说法，双向各写一条。
"本月" = ["这个月", "当月"]
"这个月" = ["本月", "当月"]
"当月" = ["本月", "这个月"]
"本周" = ["这周", "这个星期"]
"这周" = ["本周", "这个星期"]
"目标" = ["要把", "计划", "打算"]
"称呼" = ["叫我", "简称"]
"叫我" = ["称呼"]
"负责人" = ["负责", "专责", "联系人"]
"联系人" = ["负责人", "联系方式"]
"红线" = ["禁止", "不许", "必须先"]
"偏好" = ["喜欢", "习惯", "默认用"]

