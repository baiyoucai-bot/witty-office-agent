## 判为同一份资料（merge = true）的证据

- 正文跨文件接续：前一份结尾是半句话、半张表、半个条款，后一份开头正好接上。
- 内部页码连续，或页眉页脚是同一个文件标题、同一个文号。
- 封面、目录只出现在第一份；签章页、落款、附件清单只出现在最后一份。
- 表格跨文件延续：表头只在第一份出现，后续都是纯数据行。

## 判为多份资料（merge = false）的证据

- 每一份都有自己的封面、标题、文号、签章，各自完整。
- 相对方、标的、金额、日期各不相同。
- 主题互不相干，例如一份是合同、一份是会议纪要。

## 拿不准时的处理

- 倾向于拆开。错误合并会把多份资料压成一个类型，损失比错误拆开大。
- 图片类文件如果没有可用的文本摘录，只能依据编号是否连续、数量是否合理来推断。此时保持调用方给的候选分组，把 confidence 压到 0.5 以下，并在 reason 里写明「仅凭命名推断，未读到正文」。

