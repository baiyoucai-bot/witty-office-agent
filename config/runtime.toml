[logging]
level = "INFO"

[skills]
# Agent Skills 标准目录：每个子目录一份 SKILL.md
paths = ["skills"]

[tools]
# 扫描这些包里带 @tool 的函数。内核包不可卸；业务包只加不占内核名
packages = ["witty_agent.tools", "witty_agent.plugins"]

[model]
# 密钥只走环境变量 WITTY_API_KEY / OPENAI_API_KEY，不要写进仓库
# 换成你自己的 OpenAI 兼容端点；环境变量 WITTY_BASE_URL / WITTY_MODEL_ID 会盖过这里
base_url = "http://127.0.0.1:8000/v1"
model_id = "your-model-id"
timeout_sec = 3600
max_tokens = 2048

[loop]
tool_execution = "sequential"
# sequential by default; 2+ independent read/grep/ls in one turn still run together
auto_parallel = true
retry_attempts = 3
max_turns = -1
# 0 = 不套全局超时；工具自己的 timeout_ms 仍可单独生效
tool_timeout_ms = 0
repeat_thresholds = [3, 5, 8]
# 提醒/停轮的判据：同一次调用（工具名 + 参数，路径按解析后的文件算）重复到这些次数。
# 「重复」不要求连续——中间只要没有会改变结果的调用（写/编辑/bash 等）就仍在计数，
# 只读调用（read/grep/ls…）插在中间不为重复开脱。见 guard.changes_state。
# stop after this many repeats; omit = last repeat_thresholds; 0 = never
# repeat_stop = 8
# consecutive all-error tool steps before the loop stops; 0 = never
stall_limit = 3
# one hint after the first failed tool to change approach before stall-stop
fail_strategy = true
# one hint after the first usable lookup on a simple fact question
answer_now = true
# one first-turn hint when Recalled already covers a fact question
recalled_answer = true
# Recalled hit score at or above this counts as coverage (below keeps read)
recalled_cover_min = 5
# weak Recalled naming file path(s): harness reads them (parallel if 2+) before the first model step
recalled_verify_auto = true
# Recalled missed and exactly one named slug overlaps: harness memory_read it before the first model step
browse_read_auto = true
# one follow-up when a fact-seeking turn ends with no tool/memory evidence
evidence_gate = true
# one follow-up when a choice question ends with a guessed pick
ask_gate = true
# one follow-up when a multi-step request ends with no todo list
todo_gate = true
# one follow-up when plan mode ends with a markdown plan but no exit_plan_mode
plan_gate = true
# enter plan mode when the prompt is a large workspace mutation
auto_plan = true
# advertise only core + prompt-matched situational tools to the model
thin_tools = true
# load the best matching skill body when the prompt hits name/description
auto_skill = true
auto_skill_min_score = 4
auto_skill_limit = 1

[todo]
# 有 fanout/子代理时允许多个 in_progress；收紧部署改 false
allow_parallel_in_progress = true

[time_context]
enabled = true
time_zone = "Asia/Shanghai"
refresh_interval_ms = 0

[fs]
# 会话内先 read 再覆盖写 / edit（观察策略）。WITTY_FS_OBSERVE=0 可关
observe = true

[ledger]
# 证伪账本认哪些失败属于「路径不在/不是那种东西」——**按报错文案的 prompt key 列，不按关键词**。
# 文案本体在 config/prompts.toml；账本把模板里的 `{占位符}` 换成同一行内的任意文字再去匹配
# （见 `negative_ledger._missing_patterns`），所以改措辞这里自动跟着走，不会悄悄失效。
#
# 只列「同参数重试永远是同一个结果」的失败。以下都**不能**进来，它们的正确动作是重试：
#   read_not_text / read_offset_oob / edit_not_found / edit_not_unique  → 换参数
#   fs_not_observed_* / fs_stale_version                               → 先 read 再来
#   denied_tool / sandbox_denied_*                                     → 等批准 / 换路径，不是证伪
missing_prompts = ["read_not_found", "read_not_file", "ls_not_dir", "fs_not_found_edit"]

[sandbox]
# 生成的可运行代码进 WITTY_HOME/sandbox/work，python 用旁边的 venv，不写进用户系统环境
enabled = true
index_url = "https://pypi.tuna.tsinghua.edu.cn/simple"
packages = [
  "numpy",
  "pandas",
  "openpyxl",
  "python-pptx",
  "python-docx",
  "matplotlib",
  "pillow",
  "lxml",
  "pyyaml",
  "python-dateutil",
  "pypdf",
  "pdfplumber",
  "rapidocr-onnxruntime",
]

[refine]
# /refine：复盘本会话轨迹，沉淀 role（agent AGENTS.md）/ memory（工作区记忆）/ skill（用户技能草稿）。
# 每条沉淀必须带轨迹原文当证据，对不上就丢；先快照后落笔，/refine undo 整体回滚
enabled = true
# 喂给复盘员的轨迹字符预算（从尾部往前取）
transcript_chars = 12000
# 单次最多落几条，防一次灌爆
max_items = 5
# 沉淀前先跑义务台账里验过的判据；红着说明轨迹收在坏状态上，不配沉淀
run_gates = true
# 复盘员模型，留空用会话主模型。跟 [goal].judge_model_id 一个道理：这活不需要主模型的本事
model_id = ""

[repl]
# 持久 Python 解释器：工具调用之间变量不清空，中间结果留在解释器里而不是塞进上下文。
# 用的是上面 [sandbox] 那个 venv 和那些包
enabled = true
# 单元格超时（秒）。到点先 SIGINT，驱动把它当普通单元格错误接住，解释器活着、变量还在；
# 只有连中断都不理才升级到 kill，那时才会明确告诉模型「状态没了」
timeout_sec = 60
# 一格输出的字符上限，超了掐头留尾（报错和最后打印的结果都在末尾）。0 = 不限
max_output_chars = 16384

[library]
# pip / 后台调用默认。桌面和 HTTP 仍走内核 always-ask。
# permission = ask | allow | read-only | deny
# on_timeout = allow（继续）| deny（终止该工具）
permission = "ask"
timeout_sec = 30
on_timeout = "allow"
# 库默认不往终端刷初始化 INFO。要看过程：WITTY_LOG_LEVEL=INFO 或 Witty(log_level="INFO")
log_level = "WARNING"

[llmwiki]
# 工作区 Markdown wiki（第二大脑 / 知识库）。关了技能仍可见，工具拒绝动手。
# 也可用 WITTY_LLMWIKI_ENABLED=0 / catalog 关 wiki_* / 卸业务包
enabled = true

[nl2sql]
# 自然语言问数。关了技能仍可见，工具拒绝连库。也可用 WITTY_NL2SQL_ENABLED=0
enabled = true
# 零容忍规则：用户说「全部数据」也照样带行数上限
default_limit = 1000
max_limit = 10000
max_tables = 12
# 候选 SQL 执行结果聚类的置信度阈值，低于此值要人复核
conf_threshold = 0.6
# 数据源登记。sqlite 用标准库直连；其它方言要自备 DB-API 驱动
# 驱动装法：uv sync --extra mysql / --extra postgres（见 pyproject 的 optional-dependencies）
# 注意不是装进沙箱 venv——那个解释器只跑生成的出图/算数脚本，跟这里连库的不是同一个
# 口令只走 password_env 指名的环境变量，不写进本文件
# [[nl2sql.sources]]
# name = "demo"
# dialect = "sqlite"
# dsn = "data/demo.db"
# comment = "样例库"
# [[nl2sql.sources]]
# name = "ops"
# dialect = "mysql"
# dsn = "mysql://reader@db.example.com:3306/ops"
# password_env = "WITTY_NL2SQL_OPS_PASSWORD"

[novel]
# 长篇小说状态库。业务插件，关了库层仍在，只是工具拒绝动手。也可用 WITTY_NOVEL_ENABLED=0
# 一本书 = 一个工作区目录；state/records.jsonl 是唯一事实源，registry.json 是派生物。
enabled = true
# 未回收线索超过这么多章没推进就报 dormant（warning）
dormant_thread_chapters = 3
# 主要角色超过这么多章没出场就报 absent（warning）
absent_character_chapters = 5
# 出场满这么多次才算「主要角色」，否则不查失踪——路人甲不该报警
main_character_min_appearances = 3
# 连着这么多章什么都没推进 = 中段塌陷。这个判据不问模型，只看状态有没有变
stalled_run_chapters = 3
# 上下文包的字符预算。NWM 的教训：全量倾倒的漏答里八成是「证据在包里但被截断了」，
# 所以宁可按查询挑，也不要把预算浪费在与本章无关的状态上
context_budget_chars = 6000
# 关系图扩展跳数。1 = 只带查询点到的人和他们的直接关系人。
# 调大是拿预算换召回：每多一跳人数可能翻几倍，而预算固定，挤掉的往往是更相关的近邻。
# 群像戏、多方势力交锋可以试 2，别无脑调高
expand_hops = 1

[pptx]
# 域内放映机默认装的字体。语义稿用了清单之外的字体，lint 报 font_risk 提醒会跑版。
# 生成机没装稿里的字体时排版按启发式估算，不算错；放映机没装才是真事故。
safe_fonts = [
  "Microsoft YaHei", "微软雅黑",
  "SimSun", "宋体",
  "SimHei", "黑体",
  "DengXian", "等线",
  "FangSong", "仿宋",
  "KaiTi", "楷体",
  "Arial", "Calibri", "Times New Roman",
]

[schedule]
# serve 进程内扫描间隔（秒）。0 = 关闭自动扫，仍可用 POST /v1/schedules/tick
tick_interval_s = 15

[orchestrator]
max_fanout = 8

[goal]
# 目标模式接判官：模型在 GOAL.yaml 里写 complete 只是申报，判官看轨迹里有没有权威证据。
# 关掉退回旧口径（GOAL.yaml 说完成就算完成）
judge = true
# 判官用哪个模型。留空 = 跟主模型同一个。判官每轮都要评一整条轨迹，生产上指到小快模型
# judge_model_id = "haiku"
# 连续这么多轮只说话、一个工具都不调，就停下把控制权交还用户，目标本身留着。
# 0 = 不管空转
stall_rounds = 3
# 客观 gate 的默认超时（秒）
gate_timeout_sec = 300
# 一次送给判官的轨迹上限（字符）。判官不看系统提示，只看这一轮的证据
transcript_chars = 12000
# 致命错误判据（正则）：命中就清目标停下。只列「自己不会好」的四类——凭据、额度、
# 压缩也救不回的超窗、模型没了。限流 / 过载是瞬时错误，不进这张表，保留目标下一轮重试
fatal_error_patterns = [
  "(?i)\\b401\\b|unauthorized|invalid[ _-]?api[ _-]?key|authentication failed",
  "(?i)insufficient[ _-]?quota|quota exceeded|billing|out of credit",
  "(?i)context (window|length)[^.]{0,24}exceed|prompt is too long|maximum context",
  # 「模型没了」要留够间隔：真实报错是 "The model `gpt-4-vision-preview` has been decommissioned"，
  # 模型名和措辞之间隔着几十个字符。不收 unavailable —— "model temporarily unavailable" 是过载的说法，
  # 判成致命会把眼看要做完的活扔掉
  "(?i)\\bmodel[^.\\n]{0,64}(not[ _]found|does not exist|deprecat|decommission|retired)",
]

[compaction]
enabled = true
use_model = true
context_window = 128000
reserve_tokens = 16384
keep_recent_tokens = 20000
# 超长 toolResult 只留头尾。0 = 关闭
tool_result_threshold = 8192
tool_result_head = 4096
tool_result_tail = 1024
# 出去的也要裁：write 正文 / apply_patch 差异留在 assistant 消息里，之后每次请求都照收窗口费。
# 只裁「非当前步」的超长字符串参数，路径和短参数原样留着。0 = 关闭
tool_call_arg_threshold = 8192
tool_call_arg_head = 2048
tool_call_arg_tail = 512
# clear_at_least：一次裁不出这么多字符就整体不裁。
# 每次改写都让 provider 从该条起的 prompt cache 作废，省几百字符不够抵缓存代价。0 = 老行为，能裁就裁
clear_at_least_chars = 2048
# 永不裁的工具：待办清单被裁成头尾是纯负收益，技能正文和 spill 取回同理
prune_exclude_tools = ["todo_write", "skill", "spill_read"]

[context]
# 上下文注入的字节帽 maxBytes / maxSourceBytes。0 = 不限制
max_chars = 65536
max_source_bytes = 1048576
# 指令文件候选名（兼容主流 agent 的指令文件）。必须是同目录文件名
instruction_files = ["AGENTS.override.md", "AGENTS.md", "AGENTS.MD", "CLAUDE.md", "CLAUDE.MD"]
local_instruction_files = ["AGENTS.local.md", "CLAUDE.local.md"]
# 项目根标记。空则回退 .git；无标记时项目根就是 cwd
project_root_markers = [".git"]

[diary]
# 每日日记：agent 干过的活每轮本地记一条（不花 token），小结要喊模型。
enabled = true
# 今天的小结在攒够这么多**新**条目后才重刷。往日翻篇不看这个值，一天只总结一次。
# 调小 = 小结更新，但每 N 个用工具的轮次就多一次模型调用；调大 = 省钱，当天小结更滞后。
summary_min_entries = 12
# 一次后台最多补几天的小结，防止久未启动后一口气灌一堆模型调用。
summary_max_days = 3

[spill]
# 0 = 关闭。超过该 UTF-8 字节数的纯文本工具结果落盘，模型只看首尾预览
max_inline_bytes = 65536

[web]
max_body_bytes = 65536
timeout_sec = 15
# 默认外网。deny_public=true 才锁公网（设置里选「内网」，或 WITTY_WEB_DENY_PUBLIC=1）
allow_private = true
deny_public = false
allow_hosts = ["192.168.1.100"]

[email]
# IMAP/SMTP 内网可配。不要写死某家公网邮箱。密码只走 WITTY_IMAP_PASSWORD / WITTY_SMTP_PASSWORD
imap_host = ""
imap_port = 993
imap_ssl = true
smtp_host = ""
smtp_port = 465
smtp_ssl = true
smtp_starttls = false
username = ""
mailbox = "INBOX"
drafts_dir = ""
timeout_sec = 20
max_list = 20
max_body_chars = 8000

[mcp]
servers = []
